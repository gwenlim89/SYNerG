; PlatformIO firmware configuration for the ESP32-C3 Super Mini boards.
[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Deep library dependency finding helps PlatformIO link PN532/FastLED includes reliably.
lib_ldf_mode = deep

; These USB flags make the ESP32-C3 appear as a serial device for Electron.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

; Firmware dependencies: PN532 NFC readers and FastLED strip feedback.
lib_deps =
  adafruit/Adafruit PN532
  fastled/FastLED

